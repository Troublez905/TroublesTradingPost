name: Publish trading post
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html style.css app.js desk.css desk.js risk.css risk.js futures.css futures.js paper.js paper.css resources.js resources.css leaderboard.js leaderboard.css public/
          cp -R assets public/
          python3 tools/news.py public/assets/news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
