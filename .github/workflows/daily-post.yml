name: Troubles Trading Post - Daily 1AM Publish
on:
  schedule:
    - cron: '0 1 * * *'
      timezone: America/Toronto
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate daily edition
        run: python scripts/generate_daily_post.py
      - name: Commit the archive
        run: |
          git config user.name troubles-trading-bot
          git config user.email bot@troublestradingpost.io
          git add data/archive.json posts/
          if ! git diff --cached --quiet; then
            git commit -m "chore(alpha): publish daily brief $(TZ=America/Toronto date +%F)"
          fi
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Trigger Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
